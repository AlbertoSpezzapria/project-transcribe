[project]
name = "redazione-api"
version = "0.1.0"
description = "API della piattaforma Redazione: archivio fonti, storie e produzione"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.162.1",
  "uvicorn[standard]>=0.30",
  "sqlalchemy==2.1.8",
  "alembic==1.20.1",
  "psycopg[binary,pool]==3.3.8",
  "pydantic==2.14.3",
  "pydantic-settings==2.16.2",
  "email-validator>=2.1",
  "argon2-cffi==25.1.0",
  "pyotp==2.10.0",
  "cryptography==50.0.2",
  "boto3==1.43.126",
  "filetype==1.2.0",
  "procrastinate==3.10.0",
  "python-multipart>=0.0.9",
  "typer>=0.12",
  "httpx>=0.27",
]

[project.optional-dependencies]
# Worker di trascrizione (immagine "stt")
stt = [
  "faster-whisper==1.2.1",
  "numpy>=1.26",
]
# Riconoscimento degli interlocutori: torch + pyannote (pesante, opzionale)
diarization = [
  "pyannote.audio==4.0.7",
]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "UP042"]  # Depends()/File() nei default: idioma FastAPI; enum str+Enum voluto

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"app/pipeline/clean.py" = ["E501"]  # prompt in prosa

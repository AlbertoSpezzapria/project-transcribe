version: '3.8'

services:
  db:
    image: postgres:15
    container_name: interview_postgres_dev
    restart: always
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=interviewdb
    ports:
      - "5432:5432" 
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data

volumes:
  postgres_data_dev: